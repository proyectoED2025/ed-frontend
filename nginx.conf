server {
    listen 80;
    server_name _;

    # 👉 Debe coincidir con lo que copia el Dockerfile
    root /usr/share/nginx/html;
    index index.html;

    # SPA Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Excepción: confirmación de email (preserva /api/... completo)
    location = /api/auth/confirm-email {
        proxy_pass http://forparts-api:8080/api/auth/confirm-email;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # General API (recorta /api/ como venías usando)
    location /api/ {
        proxy_pass http://forparts-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # (Opcional) compresión y cache de estáticos
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
