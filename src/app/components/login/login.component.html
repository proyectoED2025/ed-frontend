<div class="container-fluid bg-light min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h4 class="text-center mb-4">Iniciar sesión</h4>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="mb-3">
        <label for="userName" class="form-label">Usuario</label>
        <input
          type="text"
          id="userName"
          name="userName"
          class="form-control"
          [(ngModel)]="data.userName"
          required
          #userNameInput="ngModel"
          [ngClass]="{ 'is-invalid': submitted && userNameInput.invalid }"
        />
        <div *ngIf="submitted && userNameInput.invalid" class="invalid-feedback">
          Usuario requerido
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="data.password"
          required
        />
      </div>

      <div class="text-center mt-3">
        <button
          type="submit"
          class="btn btn-primary px-4 login-btn"
          [disabled]="loginForm.invalid"
        >
          Ingresar
        </button>
      </div>

      <div *ngIf="error" class="text-danger text-center mt-3">
        {{ error }}
      </div>
    </form>
    
    <div class="text-center mt-3">
      <small>¿No tienes cuenta? <a routerLink="/register" class="text-primary">Regístrate aquí</a></small>
    </div>
  </div>
</div>
