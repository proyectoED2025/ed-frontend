<div class="container-fluid bg-light min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow p-4" style="max-width: 500px; width: 100%;">
    <h4 class="text-center mb-4">Confirmación de Email</h4>

    <div class="text-center">
      <div *ngIf="isLoading" class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Confirmando...</span>
      </div>

      <div *ngIf="!isLoading && !isError" class="text-success">
        <i class="fa fa-check-circle fa-3x mb-3"></i>
        <p class="fs-5">{{ message }}</p>
        <p class="text-muted">Serás redirigido al login automáticamente...</p>
      </div>

      <div *ngIf="!isLoading && isError" class="text-danger">
        <i class="fa fa-times-circle fa-3x mb-3"></i>
        <p class="fs-5">{{ message }}</p>
        <button class="btn btn-primary mt-3" (click)="goToLogin()">
          Ir al Login
        </button>
      </div>
    </div>
  </div>
</div>
